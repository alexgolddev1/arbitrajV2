services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-${MYSQL_DATABASE:-arbitraj}}
      MYSQL_USER: ${DB_USER:-${MYSQL_USER:-bot}}
      MYSQL_PASSWORD: ${DB_PASSWORD:-${MYSQL_PASSWORD:-ArbBot_26!x7Qp2L}}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootDB_26!v9Ks4N}
    ports:
      - "${MYSQL_PORT:-4321}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  app:
    build: .
    restart: on-failure
    volumes:
      - ./log:/app/log
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-${MYSQL_DATABASE:-arbitraj}}
      DB_USER: ${DB_USER:-${MYSQL_USER:-bot}}
      DB_PASSWORD: ${DB_PASSWORD:-${MYSQL_PASSWORD:-ArbBot_26!x7Qp2L}}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-10}
      DB_CONNECT_RETRIES: ${DB_CONNECT_RETRIES:-12}
      DB_RETRY_DELAY_SECONDS: ${DB_RETRY_DELAY_SECONDS:-5}
      CALCULATOR_API_URL: ${CALCULATOR_API_URL:-https://api.coinmarketcap.com/data-api/v3/cryptocurrency/market-pairs/latest}
      SCREENER_QUOTE_SYMBOLS: ${SCREENER_QUOTE_SYMBOLS:-USDT,USDC}
      CALCULATOR_EXCHANGES: ${CALCULATOR_EXCHANGES:-binance,bybit,okx,mexc}
      CALCULATOR_CATEGORY: ${CALCULATOR_CATEGORY:-spot}
      CALCULATOR_PAGE_SIZE: ${CALCULATOR_PAGE_SIZE:-500}
      CALCULATOR_CENTER_TYPE: ${CALCULATOR_CENTER_TYPE:-all}
      CALCULATOR_SORT: ${CALCULATOR_SORT:-cmc_rank_advanced}
      CALCULATOR_DIRECTION: ${CALCULATOR_DIRECTION:-desc}
      CALCULATOR_SPOT_UNTRACKED: ${CALCULATOR_SPOT_UNTRACKED:-true}
      CALCULATOR_SPREAD_LEVELS: ${CALCULATOR_SPREAD_LEVELS:-0.85,1,1.5}
      CALCULATOR_SPREAD_RESET_PERCENT: ${CALCULATOR_SPREAD_RESET_PERCENT:-0.8}
      CALCULATOR_REQUEST_DELAY_SECONDS: ${CALCULATOR_REQUEST_DELAY_SECONDS:-0.2}
      CALCULATOR_WORKERS: ${CALCULATOR_WORKERS:-4}
      TRADER_MIN_OPPORTUNITY_LIFETIME_SECONDS: ${TRADER_MIN_OPPORTUNITY_LIFETIME_SECONDS:-15}
      TRANSFER_NETWORK_MAP: ${TRANSFER_NETWORK_MAP:-BTC:BITCOIN,ETH:ETHEREUM,SOL:SOLANA,TON:TON,TRX:TRON,BNB:BSC,EGLD:MULTIVERSX}
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      BYBIT_API_KEY: ${BYBIT_API_KEY:-}
      BYBIT_API_SECRET: ${BYBIT_API_SECRET:-}
      OKX_API_KEY: ${OKX_API_KEY:-}
      OKX_API_SECRET: ${OKX_API_SECRET:-${OkX_API_SECRET:-}}
      OKX_API_PASSPHRASE: ${OKX_API_PASSPHRASE:-${OkX_passphrase:-}}
      MEXC_API_KEY: ${MEXC_API_KEY:-}
      MEXC_API_SECRET: ${MEXC_API_SECRET:-}

  trader:
    build: .
    command: ["python", "-m", "main.treider.service"]
    restart: unless-stopped
    volumes:
      - ./log:/app/log
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-${MYSQL_DATABASE:-arbitraj}}
      DB_USER: ${DB_USER:-${MYSQL_USER:-bot}}
      DB_PASSWORD: ${DB_PASSWORD:-${MYSQL_PASSWORD:-ArbBot_26!x7Qp2L}}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-10}
      DB_CONNECT_RETRIES: ${DB_CONNECT_RETRIES:-12}
      DB_RETRY_DELAY_SECONDS: ${DB_RETRY_DELAY_SECONDS:-5}
      TRADER_SIGNAL_POLL_INTERVAL_SECONDS: ${TRADER_SIGNAL_POLL_INTERVAL_SECONDS:-0.5}
      TRADER_ACTIVE_OPPORTUNITY_FALLBACK_SECONDS: ${TRADER_ACTIVE_OPPORTUNITY_FALLBACK_SECONDS:-6}
      TRADER_MARKET_DATA_TIMEOUT_SECONDS: ${TRADER_MARKET_DATA_TIMEOUT_SECONDS:-5}
      TRADER_NETWORK_CACHE_TTL_SECONDS: ${TRADER_NETWORK_CACHE_TTL_SECONDS:-60}
      TRADER_FEE_CACHE_TTL_SECONDS: ${TRADER_FEE_CACHE_TTL_SECONDS:-300}
      TRADER_TRAINING_MODE: ${TRADER_TRAINING_MODE:-1}
      TRADER_INITIAL_BALANCE_USD: ${TRADER_INITIAL_BALANCE_USD:-100}
      TRANSFER_NETWORK_MAP: ${TRANSFER_NETWORK_MAP:-BTC:BITCOIN,ETH:ETHEREUM,SOL:SOLANA,TON:TON,TRX:TRON,BNB:BSC,EGLD:MULTIVERSX}
      TRADER_BINANCE_TAKER_FEE: ${TRADER_BINANCE_TAKER_FEE:-}
      TRADER_BYBIT_TAKER_FEE: ${TRADER_BYBIT_TAKER_FEE:-}
      TRADER_OKX_TAKER_FEE: ${TRADER_OKX_TAKER_FEE:-}
      TRADER_MEXC_TAKER_FEE: ${TRADER_MEXC_TAKER_FEE:-}
      TRADER_BINANCE_BUY_FEE_CURRENCY: ${TRADER_BINANCE_BUY_FEE_CURRENCY:-quote}
      TRADER_BYBIT_BUY_FEE_CURRENCY: ${TRADER_BYBIT_BUY_FEE_CURRENCY:-quote}
      TRADER_OKX_BUY_FEE_CURRENCY: ${TRADER_OKX_BUY_FEE_CURRENCY:-quote}
      TRADER_MEXC_BUY_FEE_CURRENCY: ${TRADER_MEXC_BUY_FEE_CURRENCY:-quote}
      TRADER_ALLOW_UNCONFIRMED_ROUTE_DEMO: ${TRADER_ALLOW_UNCONFIRMED_ROUTE_DEMO:-1}
      TRADER_ALLOW_DISABLED_ROUTE_DEMO: ${TRADER_ALLOW_DISABLED_ROUTE_DEMO:-0}
      TRADER_TRANSFER_NETWORK: ${TRADER_TRANSFER_NETWORK:-}
      TRADER_FIXED_TRANSFER_SECONDS: ${TRADER_FIXED_TRANSFER_SECONDS:-300}
      TRADER_RANDOM_TRANSFER_TIME: ${TRADER_RANDOM_TRANSFER_TIME:-0}
      TRADER_TRANSFER_RANDOM_SEED: ${TRADER_TRANSFER_RANDOM_SEED:-}
      TRADER_TRANSFER_FEE_AMOUNT: ${TRADER_TRANSFER_FEE_AMOUNT:-}
      TRADER_TRANSFER_FEE_CURRENCY: ${TRADER_TRANSFER_FEE_CURRENCY:-}
      TRADER_MIN_NET_PROFIT_USDT: ${TRADER_MIN_NET_PROFIT_USDT:-0}
      TRADER_PRICE_MOVE_RESERVE_PERCENT: ${TRADER_PRICE_MOVE_RESERVE_PERCENT:-0}
      TRADER_MAX_LOSS_PROFIT_RATIO: ${TRADER_MAX_LOSS_PROFIT_RATIO:-0.25}
      TRADER_MAX_LOSS_BALANCE_PERCENT: ${TRADER_MAX_LOSS_BALANCE_PERCENT:-0.5}
      CALCULATOR_SPREAD_LEVELS: ${CALCULATOR_SPREAD_LEVELS:-0.85,1,1.5}
      TRADER_SETTLEMENT_RETRY_SECONDS: ${TRADER_SETTLEMENT_RETRY_SECONDS:-15}
      TRADER_SETTLEMENT_MAX_WAIT_SECONDS: ${TRADER_SETTLEMENT_MAX_WAIT_SECONDS:-3600}
      TRADER_SIGNAL_MAX_AGE_SECONDS: ${TRADER_SIGNAL_MAX_AGE_SECONDS:-300}
      TRADER_SAME_ROUTE_REENTRY_COOLDOWN_SECONDS: ${TRADER_SAME_ROUTE_REENTRY_COOLDOWN_SECONDS:-300}
      TRADER_SIGNAL_MAX_ATTEMPTS: ${TRADER_SIGNAL_MAX_ATTEMPTS:-5}
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      BYBIT_API_KEY: ${BYBIT_API_KEY:-}
      BYBIT_API_SECRET: ${BYBIT_API_SECRET:-}
      OKX_API_KEY: ${OKX_API_KEY:-}
      OKX_API_SECRET: ${OKX_API_SECRET:-${OkX_API_SECRET:-}}
      OKX_API_PASSPHRASE: ${OKX_API_PASSPHRASE:-${OkX_passphrase:-}}
      MEXC_API_KEY: ${MEXC_API_KEY:-}
      MEXC_API_SECRET: ${MEXC_API_SECRET:-}

  web:
    build: .
    command: ["python", "-m", "main.web"]
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-${MYSQL_DATABASE:-arbitraj}}
      DB_USER: ${DB_USER:-${MYSQL_USER:-bot}}
      DB_PASSWORD: ${DB_PASSWORD:-${MYSQL_PASSWORD:-ArbBot_26!x7Qp2L}}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-10}
      DB_CONNECT_RETRIES: ${DB_CONNECT_RETRIES:-12}
      DB_RETRY_DELAY_SECONDS: ${DB_RETRY_DELAY_SECONDS:-5}
      WEB_PORT: 8080
      SCREENER_QUOTE_SYMBOLS: ${SCREENER_QUOTE_SYMBOLS:-USDT,USDC}
      CALCULATOR_SPREAD_LEVELS: ${CALCULATOR_SPREAD_LEVELS:-0.85,1,1.5}
      BUY_PRICE_MUST_BE_LOWER: ${BUY_PRICE_MUST_BE_LOWER:-true}
    ports:
      - "${WEB_PORT:-8080}:8080"

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"

volumes:
  mysql_data:
    name: arbitrajv2_mysql_data
